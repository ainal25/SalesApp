name: Build SalesApp (Debug APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan klik tombol 'Run workflow' manual di GitHub

jobs:
  build:
    name: Build Android Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Runner (Menjamin Gradle tersedia di cloud)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      
      - name: Compile & Build (Debug APK)
        run: |
          if [ -f "./gradlew" ]; then
            echo "File gradlew ditemukan di repo. Menjalankan via ./gradlew..."
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "File gradlew tidak ada di repo. Menggunakan Gradle cloud otomatis..."
            gradle assembleDebug
          fi

      - name: Upload Hasil Build Artifact (Debug APK)
        uses: actions/upload-artifact@v4
        with:
          name: SalesApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

