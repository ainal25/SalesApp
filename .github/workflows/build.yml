name: Build MyAndroidApp (Debug APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan klik tombol 'Run workflow' manual di GitHub

jobs:
  build:
    name: Build Android Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Jadikan gradlew executable (Izin Akses)
        run: chmod +x gradlew

      
      - name: Compile & Build dengan Gradle (Debug APK)
        run: ./gradlew assembleDebug

      - name: Upload Hasil Build Artifact (Debug APK)
        uses: actions/upload-artifact@v4
        with:
          name: MyAndroidApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

